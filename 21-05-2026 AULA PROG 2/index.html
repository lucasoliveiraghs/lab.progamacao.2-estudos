<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="shortcut icon" href="img/flat-style-icon-depicting-survey-260nw-2754821831.webp" type="image/x-icon">k
</head>
<body>

    
    <div class="conteudo-formulário">
        <h1>Introdução a formulários</h1>
    
        <form>
            <label for="pNome"> Nome:</label> 
            <input type="text" name="nome" id="pNome" size="30"> 

            <label for="sobreNome"> Sobrenome:</label> 
            <input type="text" name="sobrenome" id="sobreNome" size="30">

            <h3>Selecione seu curso</h3>

            <input type="radio" name="curso" id="tinf">
            <label for="tinf">Técnico em informática</label> <br>

            <input type="radio" name="curso" id="cont">
            <label for="cont">Técnico em contabilidade</label> <br>

            <input type="radio" name="curso" id="adm">
            <label for="adm">Técnico em administração</label> <br>

            <input type="radio" name="curso" id="ele">
            <label for="ele">Técnico em Eletrônica</label> <br>

            <h3>Dados da plataforma</h3>

            <label for="endEmail"> Email: </label> 
            <input type="email" id="endEmail"> <br>

            <label for="senha">Defina uma senha</label>
            <input type="password" id="senha" >
            

        </form>
    </div>
</body>
</html>
